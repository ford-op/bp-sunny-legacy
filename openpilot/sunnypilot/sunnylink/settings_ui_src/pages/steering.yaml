# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
# BluePilot: the lateral library's settings (params/manifest.py in ford-op/bluepilot-lateral), shown only for a
# Ford, with BluePilot 7's titles, text and order. A section here rather than in vehicle.yaml: the sunnylink app
# shows decimal settings in vehicle_settings as 0.00 although the device has the value, and it doesn't show pages
# it doesn't know (bp-sunnypilot #12). No disable toggle: BluePilot is always on in bp-sunnypilot.
# test_ford_settings.py checks the keys and limits against the manifest.
- id: ford
  title: Ford BluePilot Settings
  description: BluePilot's Ford lateral control. Items are grouped by category ([Vehicle], [Lateral Tuning]).
  visibility:
  - type: capability
    field: brand
    equals: ford
  items:
  # --- Vehicle ---
  - key: FordPrefSteerAngleCurvature
    widget: toggle
    needs_onroad_cycle: true
    title: '[Vehicle] Use Pinion Yaw Sensor'
    description: 'Measures how the car is turning from the steering pinion angle sensor
      instead of the RCM yaw sensor, in both the control software and the panda safety
      firmware. Use this if your Ford has a faulty yaw sensor: frequent "Turn Exceeds
      Steering Limit" warnings and weak curve tracking with healthy steering, often
      alongside "Service AdvanceTrac" messages. Run tools/ford_yaw_health_check.py on a
      few drives to check. Takes effect the next time the car starts. Not available on
      the Edge (its pinion sensor only reports a relative angle).'
    enablement:
    - $ref: '#/macros/offroad'
  # --- Lateral Tuning ---
  # Offroad only: the panda treats the two modes differently, and nothing handles a switch while engaged.
  - key: FordPrefLateralControl
    widget: multiple_button
    title: '[Lateral Tuning] Primary Control Variable'
    description: Curvature uses the existing 4-signal strategy. Angle uses path_angle as the primary actuator (in development).
    options:
    - value: 0
      label: Curvature
    - value: 1
      label: Angle
    enablement:
    - $ref: '#/macros/offroad'
  # Angle-mode tuning (shown when Primary Control Variable = Angle)
  - key: FordLowSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] Low Speed Adjustment Factor (Angle)'
    description: Scales the low-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] High Speed Adjustment Factor (Angle)'
    description: Scales the high-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedDampening_ang
    widget: option
    title: '[Lateral Tuning] High Speed Low Curve Adjustment Factor (Angle)'
    description: Tune adjustment factor for low curve straightaways (highways) at high speeds. If oversteering, reduce. If understeering, increase
    min: 0.25
    max: 1.25
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: lane_change_factor_high_ang
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Angle)'
    description: Scales steering during a lane change in angle mode. Values >1.0 boost it.
    min: 0.85
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  # Not in BluePilot 7's sunnylink section; names and steps from its comma four menu
  - key: enable_lane_positioning_ang
    widget: toggle
    title: '[Lateral Tuning] Enable Lane Positioning (Angle)'
    description: Nudge the vehicle toward true lane-line center (plus optional bias) while in angle-primary control.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: custom_path_offset_ang
    widget: option
    title: '[Lateral Tuning] In-Lane Offset (Angle)'
    description: Adjust the in-lane offset (-0.5 to 0.5 m).
    min: -0.5
    max: 0.5
    step: 0.01
    unit: m
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - type: param
      key: enable_lane_positioning_ang
      equals: true
  - key: lane_centering_strength_ang
    widget: option
    title: '[Lateral Tuning] Lane Centering Strength (Angle)'
    description: How much authority the lane centering trim has vs. the model's own path (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - type: param
      key: enable_lane_positioning_ang
      equals: true
  # Curvature-mode tuning (shown when Primary Control Variable = Curvature)
  - key: enable_human_turn_detection_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Human Turn Detection (Curvature)'
    description: Enable detection of human-initiated turns.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: lane_change_factor_high_curv
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Curvature)'
    description: Scales steering during a lane change in curvature mode. Values <1.0 reduce it.
    min: 0.5
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: enable_lane_positioning_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lane Positioning (Curvature)'
    description: Enable custom lane positioning controls.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: custom_path_offset_curv
    widget: option
    title: '[Lateral Tuning] In-Lane Offset (Curvature)'
    description: Adjust the in-lane offset (-0.5 to 0.5 m).
    min: -0.5
    max: 0.5
    step: 0.05
    unit: m
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  - key: enable_lane_full_mode_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lanefull Mode (Curvature)'
    description: Enable lanefull mode for lane positioning.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  # Stored as 0/1 (INT), so a two-choice button: sunnylink converts a saved value with the param's type
  - key: custom_profile_curv
    widget: multiple_button
    title: '[Lateral Tuning] Use Custom Tuning Profile (Curvature)'
    description: Enable custom tuning profile settings.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 'On'
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: pc_blend_ratio_high_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio High (Curvature)'
    description: Adjust the high curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  - key: pc_blend_ratio_low_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio Low (Curvature)'
    description: Adjust the low curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  # Applies whenever lane positioning is on (lateral_curv_ext.py), custom profile or not
  - key: LC_PID_gain_UI_curv
    widget: option
    title: '[Lateral Tuning] Centering PID Gain (Curvature)'
    description: PID gain for the curvature-mode centering controller. Applies whenever lane positioning is on.
    min: 0.0
    max: 50.0
    step: 0.5
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: Looks ahead at planned steering to reduce sudden corrections, so the wheel moves more smoothly through turns. Works with Self-Tune and custom tuning. Thanks to @twilsonco for the implementation.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal.
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: has_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
